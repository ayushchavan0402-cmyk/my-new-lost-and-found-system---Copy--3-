<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Found Item | College Lost & Found</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.container{
    width:92%;
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
}

.back{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#2563eb;
    margin:15px 0 25px;
}

.note{
    background:#fff3cd;
    color:#856404;
    padding:14px;
    border-radius:9px;
    margin-bottom:25px;
    line-height:1.5;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    resize:vertical;
}

/* IMAGE */

.upload-box{
    border:2px dashed #2563eb;
    padding:20px;
    border-radius:12px;
    text-align:center;
    background:#f8fbff;
}

.upload-box input{
    border:none;
    background:transparent;
}

.upload-box p{
    color:#777;
    font-size:13px;
}

#preview{
    display:none;
    width:100%;
    max-width:350px;
    height:250px;
    object-fit:contain;
    margin:15px auto 0;
    border-radius:10px;
    border:1px solid #ddd;
    background:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block !important;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block !important;
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:600px){

    .container{
        width:94%;
        padding:20px;
    }

}

</style>

</head>


<body>


<div class="container">


<a href="dashboard.html" class="back">
← Back to Dashboard
</a>


<h1>
🎁 Report Found Item
</h1>


<div class="note">

<b>Important:</b>

Please submit the found item to the
College Security Office after reporting it.

</div>


<form id="foundForm">


<!-- FINDER NAME -->

<div class="form-group">

<label>
Finder Name
</label>

<input
type="text"
id="finderName"
placeholder="Enter your name"
required>

</div>


<!-- PRN -->

<div class="form-group">

<label>
PRN / Staff ID
</label>

<input
type="text"
id="prn"
placeholder="Enter PRN / Staff ID"
required>

</div>


<!-- PHONE -->

<div class="form-group">

<label>
Phone Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter phone number"
required>

</div>


<!-- ITEM NAME -->

<div class="form-group">

<label>
Item Name
</label>

<input
type="text"
id="itemName"
placeholder="Example: Black Wallet"
required>

</div>


<!-- CATEGORY -->

<div class="form-group">

<label>
Category
</label>

<select id="category" required>

<option value="">
Select Category
</option>

<option>ID Card</option>
<option>Wallet</option>
<option>Mobile</option>
<option>Laptop</option>
<option>Bag</option>
<option>Keys</option>
<option>Watch</option>
<option>Books</option>
<option>Bottle</option>
<option>Other</option>

</select>

</div>


<!-- DESCRIPTION -->

<div class="form-group">

<label>
Description
</label>

<textarea
id="description"
rows="4"
placeholder="Mention color, brand, identification marks etc."
></textarea>

</div>


<!-- FOUND LOCATION -->

<div class="form-group">

<label>
Found Location
</label>

<select id="location" required>

<option value="">
Select Location
</option>

<option>Library</option>
<option>Canteen</option>
<option>Parking</option>
<option>Classroom</option>
<option>Laboratory</option>
<option>Hostel</option>
<option>Sports Ground</option>
<option>Auditorium</option>
<option>Other</option>

</select>

</div>


<!-- DATE -->

<div class="form-group">

<label>
Date Found
</label>

<input
type="date"
id="dateFound"
required>

</div>


<!-- IMAGE -->

<div class="form-group">

<label>
Upload Item Image
</label>

<div class="upload-box">

<input
type="file"
id="image"
accept="image/jpeg,image/png,image/jpg,image/webp"
required>

<p>
Select JPG, JPEG, PNG or WEBP image
</p>

<img
id="preview"
alt="Selected Item Preview"
>

</div>

</div>


<!-- CURRENT LOCATION -->

<div class="form-group">

<label>
Current Item Location
</label>

<select id="currentLocation" required>

<option value="">
Select Current Location
</option>

<option>
Security Office
</option>

<option>
Department Office
</option>

<option>
Library Desk
</option>

<option>
With Finder (Temporary)
</option>

</select>

</div>


<button type="submit">
Submit Found Report
</button>


</form>


<div id="message"></div>


</div>


<script>


/* =====================================
   IMAGE PREVIEW
===================================== */

const imageInput =
document.getElementById("image");

const preview =
document.getElementById("preview");

let selectedImage = "";


imageInput.addEventListener(
"change",
function(){

    const file = this.files[0];

    if(!file){

        preview.style.display = "none";

        preview.src = "";

        selectedImage = "";

        return;

    }


    if(!file.type.startsWith("image/")){

        alert(
            "Please select a valid image."
        );

        this.value = "";

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        selectedImage =
        e.target.result;

        preview.src =
        selectedImage;

        preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

});


/* =====================================
   SUBMIT FOUND REPORT
===================================== */

document
.getElementById("foundForm")
.addEventListener(
"submit",
function(e){

    e.preventDefault();


    if(!selectedImage){

        alert(
            "Please select an item image."
        );

        return;

    }


    /* Create Object */

    const foundItem = {

        id: Date.now(),

        type: "FOUND",

        finderName:
        document.getElementById(
            "finderName"
        ).value,

        prn:
        document.getElementById(
            "prn"
        ).value,

        phone:
        document.getElementById(
            "phone"
        ).value,

        itemName:
        document.getElementById(
            "itemName"
        ).value,

        category:
        document.getElementById(
            "category"
        ).value,

        description:
        document.getElementById(
            "description"
        ).value,

        location:
        document.getElementById(
            "location"
        ).value,

        dateFound:
        document.getElementById(
            "dateFound"
        ).value,

        image:
        selectedImage,

        currentLocation:
        document.getElementById(
            "currentLocation"
        ).value,

        status:"FOUND"

    };


    /* Get old reports */

    let reports =
    JSON.parse(
        localStorage.getItem(
            "foundReports"
        )
    ) || [];


    /* Add new report */

    reports.push(foundItem);


    /* Save to browser */

    localStorage.setItem(
        "foundReports",
        JSON.stringify(reports)
    );


    /* Show success */

    const message =
    document.getElementById(
        "message"
    );


    message.innerText =
    "✅ Found Item Report Submitted Successfully!";


    message.className =
    "success";


    /* Reset form */

    document
    .getElementById(
        "foundForm"
    )
    .reset();


    preview.src = "";

    preview.style.display =
    "none";

    selectedImage = "";


});

</script>


</body>

</html>
