<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | College Lost & Found</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;
        }

        /* Background circles */

        body::before {

            content: "";

            position: fixed;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.10);

            top: -120px;

            left: -100px;
        }

        body::after {

            content: "";

            position: fixed;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.08);

            bottom: -180px;

            right: -120px;
        }

        /* Main Card */

        .login-card {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 900px;

            min-height: 540px;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            display: grid;

            grid-template-columns: 1fr 1fr;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);
        }

        /* Left Section */

        .welcome-section {

            background:
                linear-gradient(
                    145deg,
                    #0d6efd,
                    #063b8c
                );

            color: white;

            padding: 55px 45px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }

        .logo {

            width: 100px;

            height: 100px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.18);

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 52px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.15);
        }

        .welcome-section h1 {

            font-size: 32px;

            margin-bottom: 15px;
        }

        .welcome-section p {

            font-size: 16px;

            line-height: 1.6;

            opacity: 0.9;

            max-width: 350px;
        }

        .features {

            margin-top: 30px;

            display: flex;

            flex-direction: column;

            gap: 12px;

            width: 100%;

            max-width: 300px;
        }

        .feature {

            background:
                rgba(255,255,255,0.12);

            padding: 11px 15px;

            border-radius: 10px;

            text-align: left;

            font-size: 14px;
        }

        /* Right Login Section */

        .login-section {

            padding: 55px 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }

        .login-section h2 {

            color: #172b4d;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #777;

            margin-bottom: 30px;

            font-size: 14px;
        }

        .input-group {

            margin-bottom: 20px;
        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

            font-size: 14px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;
        }

        .input-wrapper input {

            width: 100%;

            padding: 14px 15px 14px 45px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-wrapper input:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px
                rgba(13,110,253,0.12);
        }

        /* Password Eye */

        .eye {

            position: absolute;

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;

            font-size: 18px;
        }

        /* Login Button */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #0d6efd,
                    #084fc7
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }

        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(13,110,253,0.3);
        }

        /* Register */

        .register {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

        .register a {

            color: #0d6efd;

            text-decoration: none;

            font-weight: bold;
        }

        .register a:hover {

            text-decoration: underline;
        }

        /* Message */

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }

        .error {

            background: #f8d7da;

            color: #842029;
        }

        /* Mobile */

        @media (max-width: 700px) {

            body {

                overflow: auto;
            }

            .login-card {

                grid-template-columns: 1fr;

                max-width: 450px;
            }

            .welcome-section {

                padding: 35px 25px;
            }

            .welcome-section h1 {

                font-size: 26px;
            }

            .logo {

                width: 75px;

                height: 75px;

                font-size: 38px;
            }

            .features {

                display: none;
            }

            .login-section {

                padding: 35px 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- LEFT SIDE -->

    <div class="welcome-section">


        <div class="logo">
            🔎
        </div>


        <h1>
            Lost & Found
        </h1>


        <p>
            College Lost & Found Management System
        </p>


        <div class="features">

            <div class="feature">
                📦 Report Lost Items
            </div>

            <div class="feature">
                🎁 Report Found Items
            </div>

            <div class="feature">
                🔍 Search Items Easily
            </div>

            <div class="feature">
                🤝 Help Items Reach Their Owners
            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-section">


        <h2>
            Welcome Back 👋
        </h2>


        <p class="subtitle">
            Login to access your college account
        </p>


        <form id="loginForm">


            <!-- Email / PRN -->

            <div class="input-group">

                <label>
                    College Email / PRN
                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>


                    <input
                        type="text"
                        id="email"
                        placeholder="Enter Email or PRN"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label>
                    Password
                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >


                    <span
                        class="eye"
                        id="eye"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login to Account →
            </button>


        </form>


        <div
            id="message"
            class="message error"
        ></div>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>


</div>


<script>


    // ============================
    // SHOW / HIDE PASSWORD
    // ============================

    document
        .getElementById("eye")
        .addEventListener("click", function() {

            const password =
                document.getElementById("password");


            if (password.type === "password") {

                password.type = "text";

                this.innerText = "🙈";

            }

            else {

                password.type = "password";

                this.innerText = "👁️";

            }

        });


    // ============================
    // LOGIN
    // ============================

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value
                    .trim();


            const message =
                document.getElementById("message");


            message.style.display = "none";


            if (
                email === "" ||
                password === ""
            ) {

                message.innerText =
                    "Please enter Email/PRN and Password.";

                message.style.display = "block";

                return;

            }


            // DEMO LOGIN

            alert("✅ Login Successful!");


            window.location.href =
                "dashboard.html";

        });


</script>


</body>

</html>
